name: issue-runner

# The loop that walks this repo's own issue queue. It runs on a schedule, decides from
# `status:*` labels whether there is anything to do, and only then claims an issue and hands it
# to Claude. A tick with nothing to do costs a handful of API calls and never starts Claude.
#
# This repo dogfoods its own action: `Vuzmir/issue-runner@v1` always points at the tip of
# `main` (see retag.yml), so every tick runs whatever this repo currently ships.

on:
  schedule:
    # Top of every hour. Scheduled workflows only fire from the default branch.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Force a specific open issue number instead of taking the next one"
        required: false
        default: ""
      dry_run:
        description: "Decide and report, but do not change any label"
        type: boolean
        default: false

# One tick at a time. A tick that overruns the hour makes the next one queue rather than race
# it, which is what keeps "one issue in flight" true.
concurrency:
  group: issue-runner
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read # reading workflow runs is how dead locks are detected, and how CI logs are fetched
  checks: read # a pull request's check conclusions - the question that replaces asking a model
  statuses: read # the same answer from integrations that still report commit statuses

jobs:
  tick:
    # Manual dispatch always works; the schedule runs unless the repository variable
    # ISSUE_RUNNER_ENABLED is explicitly set to 'false'. Unset - the default state - means
    # enabled. That variable is the kill switch: flipping it to 'false' stops the loop without
    # touching this file.
    if: github.event_name == 'workflow_dispatch' || vars.ISSUE_RUNNER_ENABLED != 'false'
    runs-on: [self-hosted]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the run can branch and push later on.
          fetch-depth: 0
          # Checked out with the same token the runner pushes with, because checkout is what
          # leaves credentials in .git/config. The fallback keeps an idle tick working before
          # the secret exists; a tick that actually claims something fails loudly instead.
          token: ${{ secrets.ISSUE_RUNNER_TOKEN || github.token }}

      # Claim, work and release all happen inside this one step. What the worker does is not
      # described here: the action carries its own procedure and copies it, and the claimed
      # issue, into a state directory it reads from itself.
      - uses: Vuzmir/issue-runner@v1
        with:
          dry-run: ${{ inputs.dry_run }}
          force-issue: ${{ inputs.issue }}
          model: sonnet
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ secrets.ISSUE_RUNNER_TOKEN }}
