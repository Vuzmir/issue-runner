name: 'Issue Runner'
description: >-
  Walks the issue queue one issue at a time using status:* labels as the lock, and hands each
  claimed issue to Claude Code.

inputs:
  token:
    description: 'Token used for the GitHub API. Needs issues:write, checks:read, actions:read.'
    required: false
    default: ${{ github.token }}
  label-prefix:
    description: 'Prefix for the state labels.'
    required: false
    default: 'status:'
  stale-lock-minutes:
    description: 'How long a lock with no identifiable run may be held before it is reclaimed.'
    required: false
    default: '120'
  max-fix-attempts:
    description: 'How many times the runner may hand a red pull request back for a fix before parking it.'
    required: false
    default: '3'
  follow-reviews:
    description: 'Whether unanswered human comments on an open pull request are treated as work.'
    required: false
    default: 'true'
  dry-run:
    description: 'Decide and report, but do not write anything back to GitHub.'
    required: false
    default: 'false'
  force-issue:
    description: 'Take this issue instead of the next queued one.'
    required: false
    default: ''
  state-dir:
    description: 'Directory the worker exchanges files through. Defaults to $RUNNER_TEMP/issue-runner.'
    required: false
    default: ''
  model:
    description: 'Which Claude model works the issue.'
    required: false
    default: 'sonnet'
  version:
    description: >-
      Which Claude Code to run: a release channel (stable, latest) or an exact version. The
      CLI is downloaded, checksum-verified and cached per runner, so nothing has to be
      installed on the machine beforehand.
    required: false
    default: 'stable'
  node-version:
    description: >-
      Which Node.js to put on PATH for the CLI's own shell commands - the run-tests skill's
      script chief among them - as `lts`, `latest`, or an exact version. Downloaded,
      checksum-verified and cached per runner, same as the CLI itself, so a self-hosted image
      built only to run Actions does not have to carry one already.
    required: false
    default: 'lts'
  claude-token:
    description: >-
      A Claude Code OAuth token, from `claude setup-token`. Leave empty only if the step
      environment already carries ANTHROPIC_API_KEY.
    required: false
    default: ''
  github-token:
    description: >-
      Token the worker pushes and opens the pull request with. Deliberately not defaulted to
      github.token: many repositories forbid Actions from opening pull requests, and one
      opened by GITHUB_TOKEN starts no workflows - so its checks would never run, and the
      loop would wait on them forever.
    required: true

outputs:
  decision:
    description: 'busy | idle | claimed'
  issue:
    description: 'the claimed issue number, empty unless decision is claimed'
  title:
    description: 'the claimed issue title'
  task:
    description: 'implement | fix-checks | address-review'
  pull:
    description: 'the pull request being worked on, empty for a fresh issue'
  state-dir:
    description: 'the directory the worker read from and wrote back to'

runs:
  using: 'node24'
  main: 'dist/index.js'
