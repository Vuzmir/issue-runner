name: retag

# v1 and v1.0.0 are the tags every consumer of this action pins to, and the rule is that both
# always point at the same commit as `main` (see AGENTS.md). That has to hold no matter how
# main was pushed - the CLI, GitHub Desktop, anyone else with write access - so it runs here,
# server-side, on the push itself, rather than depending on whoever pushed to also run a
# script afterwards.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move v1 and v1.0.0 to this commit
        run: |
          git tag -f v1.0.0
          git tag -f v1
          git push origin v1.0.0 v1 --force
